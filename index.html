<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#111816" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="COIL" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="PROJECT COIL" />
  <title>PROJECT COIL — Classic Snake</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/app-icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <main class="app-shell">
    <section class="game-frame" aria-label="PROJECT COIL klasik yılan oyunu">
      <header class="topbar">
        <div class="brand">
          <div class="eyebrow">PROJECT COIL</div>
          <h1>CLASSIC SNAKE</h1>
        </div>
        <div class="top-actions">
          <button id="soundBtn" class="icon-btn sound-btn" type="button" aria-label="Sesi aç veya kapat">SOUND</button>
          <button id="pauseBtn" class="icon-btn pause-btn" type="button" aria-label="Duraklat">II</button>
        </div>
      </header>

      <div class="lcd-wrap">
        <div class="lcd-bezel">
          <div class="lcd-status" aria-live="polite">
            <span>SCORE <strong id="score">0000</strong></span>
            <span>BEST <strong id="best">0000</strong></span>
            <span>LV <strong id="level">1</strong></span>
          </div>
          <canvas id="game" aria-label="Yılan oyun alanı"></canvas>
          <div id="overlay" class="overlay">
            <div class="overlay-title" id="overlayTitle">READY?</div>
            <div class="overlay-copy" id="overlayCopy">Kaydır veya yön tuşuna bas</div>
            <button id="startBtn" class="primary-btn" type="button">START</button>
          </div>
        </div>
      </div>

      <div class="controls" aria-label="Yön kontrolleri">
        <button class="dpad up" data-dir="up" type="button" aria-label="Yukarı">▲</button>
        <button class="dpad left" data-dir="left" type="button" aria-label="Sol">◀</button>
        <div class="dpad-center" aria-hidden="true"></div>
        <button class="dpad right" data-dir="right" type="button" aria-label="Sağ">▶</button>
        <button class="dpad down" data-dir="down" type="button" aria-label="Aşağı">▼</button>
      </div>

      <p class="hint">Kaydır veya D-pad kullan</p>
    </section>
  </main>
  <script src="game.js?v=5"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
